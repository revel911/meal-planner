<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#2F382F"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <title>Family Dinner Planner</title>
  <style>
    @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/inter-400.woff2') format('woff2')}
    @font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/inter-500.woff2') format('woff2')}
    @font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/inter-600.woff2') format('woff2')}
    @font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/inter-700.woff2') format('woff2')}
    @font-face{font-family:'Playfair Display';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/playfair-700.woff2') format('woff2')}
    @font-face{font-family:'Playfair Display';font-style:italic;font-weight:700;font-display:swap;src:url('fonts/playfair-700italic.woff2') format('woff2')}

    :root{
      --bg:#2F382F; --bg-2:#3B453D;
      --surface:rgba(0,0,0,.18); --surface-line:rgba(198,161,76,.18);
      --gold:#C6A14C; --gold-2:#B58C38; --gold-hi:#D9B863; --gold-soft:rgba(198,161,76,.16);
      --cream:#ECE7D9; --cream-muted:#A8B2A4;
      --sage-leaf:#BDCB9E; --sage-leaf-bg:rgba(169,185,140,.18);
      --ink-on-gold:#2A2616; --line:rgba(236,231,217,.12);
      --serif:'Playfair Display',Georgia,'Times New Roman',serif;
      --sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --r-card:18px; --r-chip:14px;
      --shadow-rest:0 4px 14px rgba(0,0,0,.22);
      --shadow-raise:0 14px 36px rgba(0,0,0,.34);
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      font-family:var(--sans);
      background:linear-gradient(160deg,var(--bg-2) 0%,var(--bg) 60%) fixed; color:var(--cream);
      min-height:100vh; padding-bottom:72px; /* room for fixed tab bar */
    }
    /* soft radial gold glow behind the header */
    body::before{content:""; position:fixed; top:-120px; right:-120px; width:320px; height:320px;
      background:radial-gradient(circle at 30% 30%, rgba(198,161,76,.13), rgba(255,255,255,0) 70%);
      pointer-events:none; z-index:0;}
    .wrap{max-width:840px; margin:0 auto; padding:16px; position:relative; z-index:1}
    .kicker{font-size:.56rem; font-weight:600; letter-spacing:.3em; text-transform:uppercase; color:var(--gold-hi); margin:8px 0 0}
    .screen-title{font-family:var(--serif); font-size:2rem; font-weight:700; letter-spacing:0; color:var(--cream); margin:2px 0 6px}
    .screen-title em{color:var(--gold); font-style:italic}
    .sub{color:var(--cream-muted); font-size:.62rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; margin:0 0 16px}
    :focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:4px}

    /* tabs */
    .tabbar{
      position:fixed; left:0; right:0; bottom:0; display:flex; z-index:10;
      background:rgba(18,22,18,.72); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
      border-top:1px solid rgba(198,161,76,.14); padding:6px 0 max(6px, env(safe-area-inset-bottom));
    }
    .tab{flex:1; background:none; border:0; color:var(--cream-muted); display:flex; flex-direction:column;
      align-items:center; gap:3px; font-size:.6rem; font-weight:600; cursor:pointer; min-height:44px}
    .tab[aria-selected="true"]{color:var(--gold)}
    .tab svg{display:block}

    /* slim plan header + week nav */
    .plan-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:6px 0 8px}
    .week-nav{display:flex; align-items:center; gap:8px}
    .nav-arrow{width:30px; height:30px; border-radius:999px; border:1.5px solid rgba(198,161,76,.45);
      background:transparent; color:var(--gold); font-size:1.1rem; line-height:1; cursor:pointer; display:grid; place-items:center}
    .nav-arrow:disabled{opacity:.3; cursor:default}
    .week-when{display:flex; flex-direction:column; line-height:1.15}
    .week-rel{font-family:var(--serif); font-size:1.2rem; font-weight:700; color:var(--cream)}
    .week-range{font-size:.56rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--cream-muted)}

    /* day cards (compact) */
    .cards{display:grid; gap:8px}
    .card{
      position:relative; background:var(--surface); border:1px solid var(--surface-line);
      border-radius:var(--r-card); padding:10px 12px; overflow:hidden;
      display:flex; flex-direction:column; gap:8px;
    }
    .card.eatout{background:rgba(198,161,76,.07); border-color:rgba(198,161,76,.45)}
    .card-head{display:flex; align-items:center; gap:10px}
    .badge{flex:0 0 auto; width:28px; height:28px; border-radius:8px; display:grid; place-items:center}
    .badge svg{width:18px; height:18px}
    .badge-cook{border:1.5px solid rgba(198,161,76,.55); color:var(--gold)}
    .badge-eatout{background:linear-gradient(135deg,var(--gold),var(--gold-2)); color:var(--ink-on-gold)}
    .badge-either{border:1.5px solid rgba(169,185,140,.55); color:var(--sage-leaf)}
    .card-title{flex:1 1 auto; min-width:0; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
    .card-actions{flex:0 0 auto; display:flex; gap:4px}
    .day-label{margin:0; font-size:.54rem; font-weight:600; letter-spacing:.14em;
      text-transform:uppercase; color:var(--cream-muted)}
    .card.eatout .day-label{color:var(--gold-hi)}
    .meal-name{margin:0; font-family:var(--serif); font-size:.95rem; font-weight:700; color:var(--cream)}
    .pill-row{display:flex; flex-wrap:wrap; align-items:center; gap:6px}

    /* pills */
    .week-strip{display:flex; gap:6px; padding:2px 0 12px}
    .ws-chip{flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:1px; align-items:center;
      background:var(--surface); border:1px solid var(--surface-line); border-radius:10px; padding:5px 4px;
      color:var(--cream); cursor:pointer; font-family:var(--sans)}
    .ws-chip.is-today{border-color:var(--gold); background:var(--gold-soft)}
    .ws-day{font-size:.5rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--cream-muted)}
    .ws-date{font-size:.85rem; font-weight:700; color:var(--cream)}
    .ws-chip.is-today .ws-day, .ws-chip.is-today .ws-date{color:var(--gold-hi)}
    .card.is-flash{outline:2px solid var(--gold); outline-offset:2px}
    .reload-note{font-size:.7rem; color:var(--cream-muted); font-weight:600}

    .pill{display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:3px 9px;
      font-size:.6rem; font-weight:600; line-height:1.4}
    .pill svg{width:14px; height:14px}
    .pill-cat{background:var(--surface); color:var(--cream)}
    .pill-healthy{background:var(--sage-leaf-bg); color:var(--sage-leaf)}
    .pill-speed{background:var(--surface); color:var(--cream-muted)}
    .pill-cost{background:var(--surface); color:var(--gold-hi)}
    .pill-special{background:var(--gold-soft); color:var(--gold-hi)}
    .pill-where{background:var(--surface); color:var(--cream)}
    .pill-staple{background:var(--gold-soft); color:var(--gold-hi)}

    /* buttons */
    .btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-2)); color:var(--ink-on-gold);
      border:0; border-radius:999px; padding:12px 22px; font-weight:700; letter-spacing:.04em; cursor:pointer;
      min-height:44px; box-shadow:0 8px 20px rgba(181,140,56,.3)}
    .btn-soft{background:transparent; color:var(--gold-hi); border:1.5px solid rgba(198,161,76,.45);
      border-radius:999px; padding:10px 16px; font-weight:700; cursor:pointer; min-height:44px}
    .action-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:14px 0}
    /* compact action-row buttons on the Plan screen */
    #screen-plan .action-row .btn-primary{padding:8px 16px; min-height:36px; font-size:.82rem; box-shadow:0 6px 16px rgba(181,140,56,.28)}
    #screen-plan .action-row .btn-primary:disabled{opacity:.45; cursor:default; box-shadow:none}
    #screen-plan .action-row .btn-lock{width:36px; height:36px}

    /* banners / states */
    .banner{background:var(--surface); border:1px solid rgba(169,185,140,.35); color:var(--sage-leaf);
      border-radius:var(--r-chip); padding:10px 12px; font-size:.78rem; font-weight:600; margin:0 0 12px}
    .banner.warn{background:var(--surface); border-color:rgba(198,161,76,.45); color:var(--gold-hi)}
    .empty{color:var(--cream-muted); text-align:center; padding:40px 16px; font-weight:600}
    .healthy-meter{font-size:.78rem; font-weight:700; color:var(--gold-hi)}

    /* shopping */
    .aisle-h{font-size:.7rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
      color:var(--cream-muted); margin:16px 0 6px}
    .shop-row{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--surface-line);
      border-radius:12px; padding:10px 12px; margin-bottom:6px}
    .shop-row input{accent-color:var(--gold)}
    .shop-row.is-checked .shop-name{text-decoration:line-through; color:var(--cream-muted)}
    .shop-name{font-weight:600; font-size:.9rem; color:var(--cream)}
    .shop-meals{margin-left:auto; color:var(--cream-muted); font-size:.7rem; font-weight:600}
    .meal-row{background:var(--surface); border:1px solid var(--surface-line); border-radius:var(--r-card);
      padding:12px 14px; margin-bottom:10px}
    .meal-row .meal-name{margin-left:0}
    .meal-ings{color:var(--cream-muted); font-size:.75rem; font-weight:600; margin:8px 0 0}

    .override-warn{color:var(--gold-hi); font-size:.72rem; font-weight:700; margin:6px 0 0}
    .override-warn:empty{display:none}

    /* card action buttons */
    .btn-icon{width:30px; height:30px; border-radius:999px; background:transparent;
      border:1.5px solid rgba(198,161,76,.45); color:var(--gold); display:grid; place-items:center; cursor:pointer}
    .btn-icon svg{width:16px; height:16px}
    .btn-icon.is-on{color:var(--ink-on-gold); background:linear-gradient(135deg,var(--gold),var(--gold-2)); border-color:transparent}

    /* meals-tab thumbs */
    .thumbs{margin-left:auto; display:flex; gap:6px}
    .btn-thumb{width:30px; height:30px; border-radius:999px; background:transparent;
      border:1px solid var(--surface-line); color:var(--cream-muted); display:grid; place-items:center; cursor:pointer}
    .btn-thumb svg{width:16px; height:16px}
    .btn-thumb.is-on{color:var(--gold); border-color:rgba(198,161,76,.55); background:var(--gold-soft)}

    /* picker bottom sheet */
    .picker-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:20}
    .picker-sheet{position:fixed; left:0; right:0; bottom:0; z-index:21; max-height:70vh; overflow:auto;
      background:#222a23; border:1px solid rgba(198,161,76,.25); border-radius:18px 18px 0 0;
      padding:16px 16px max(16px, env(safe-area-inset-bottom)); max-width:840px; margin:0 auto}
    .picker-title{font-family:var(--serif); font-size:1.2rem; color:var(--cream); margin:0 0 12px}
    .picker-row{display:flex; justify-content:space-between; align-items:center; width:100%; gap:10px;
      background:transparent; border:0; border-bottom:1px solid rgba(236,231,217,.08);
      padding:12px 4px; color:var(--cream); font-size:.95rem; text-align:left; cursor:pointer; min-height:44px}
    .picker-cat{color:var(--cream-muted); font-size:.72rem; font-weight:600}

    [hidden]{display:none !important}
    @media (prefers-reduced-motion: no-preference){
      .card{transition:transform .14s ease, opacity .14s ease}
    }
    @media (min-width:600px){ .cards{grid-template-columns:1fr 1fr} }
  </style>
</head>
<body>
  <main class="wrap">
    <!-- PLAN -->
    <section id="screen-plan" class="screen">
      <div class="plan-head">
        <div class="week-nav">
          <button class="nav-arrow" id="btn-week-back" aria-label="Older week">‹</button>
          <div class="week-when">
            <span class="week-rel" id="week-rel">This week</span>
            <span class="week-range" id="week-range"></span>
          </div>
          <button class="nav-arrow" id="btn-week-fwd" aria-label="Newer week">›</button>
        </div>
        <span class="healthy-meter" id="healthy-meter"></span>
      </div>
      <div id="plan-banner"></div>
      <div class="action-row">
        <button class="btn-primary" id="btn-generate">Generate week</button>
        <button class="btn-icon btn-lock" id="btn-lock" aria-pressed="false" aria-label="Lock week" hidden></button>
      </div>
      <div id="week-strip"></div>
      <div class="cards" id="plan-cards"></div>
    </section>

    <!-- SHOPPING -->
    <section id="screen-shopping" class="screen" hidden>
      <h1 class="screen-title">Shopping</h1>
      <p class="sub">From this week's cook-at-home meals</p>
      <div id="shopping-list"></div>
    </section>

    <!-- MEALS -->
    <section id="screen-meals" class="screen" hidden>
      <h1 class="screen-title">Meals</h1>
      <p class="sub">From the shared Google Sheet (read-only)</p>
      <div class="action-row">
        <button class="btn-soft" id="btn-reload-meals">Reload from Sheet</button>
        <span class="reload-note" id="reload-note"></span>
      </div>
      <div id="meals-list"></div>
    </section>
    <div id="picker-host" hidden></div>
  </main>

  <nav class="tabbar" role="tablist" aria-label="Sections">
    <button class="tab" id="tab-plan" role="tab" aria-selected="true" data-screen="plan"></button>
    <button class="tab" id="tab-shopping" role="tab" aria-selected="false" data-screen="shopping"></button>
    <button class="tab" id="tab-meals" role="tab" aria-selected="false" data-screen="meals"></button>
  </nav>

  <script type="module" src="src/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
